server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 10m;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Proxy API requests to backend
    location /api/ {
        proxy_pass http://masabasi-backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy media requests to MinIO (avatar images, game covers)
    # ^~ ZORUNLU: nginx'te regex location'lar düz prefix'lerden ÖNCE denenir.
    # Aşağıdaki `~* \.(png|jpg|...)$` cache bloğu, ^~ olmadan /media/x.jpg'yi
    # kapıp statik root'tan (Flutter build dizini) servis etmeye çalışıyor ve
    # 404 dönüyordu — MinIO'ya hiç gitmiyordu.
    location ^~ /media/ {
        proxy_pass http://masabasi-minio:9000/masabasi/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Flutter web SPA — all routes fallback to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Font caching
    location ~* \.(otf|ttf)$ {
        types {
            font/otf   otf;
            font/ttf   ttf;
        }
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Media caching
    location ~* \.(png|jpg|jpeg|gif|ico|webp|svg)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # Asset caching
    location ~* \.(js|css|wasm|json|woff|woff2)$ {
        expires 5m;
        add_header Cache-Control "public, must-revalidate";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/wasm font/otf font/ttf;
}
