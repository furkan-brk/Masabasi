name: masabasi
description: Masabaşı Oyun Kulübü — Kutu Oyunu Topluluk Platformu
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  go_router: ^14.2.7
  get: ^4.6.6
  google_fonts: ^6.2.1
  dio: ^5.6.0
  cached_network_image: ^3.4.1
  intl: ^0.20.2
  shared_preferences: ^2.3.0
  file_picker: ^8.0.0
  flutter_markdown: ^0.7.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
